; AntiFake Extended - settings
; The script reads this file once, when it starts (with the server, or at a /recompile). Every
; value has a built-in default, so a missing file or a missing line changes nothing. Values
; outside the allowed range are ignored (with a note in the server console) and the default is
; used. A ";" after a space starts a comment, also behind a value; a password that contains
; " ;" itself goes in double quotes (MysqlPassword and SteamApiKey lose them; any other value
; keeps quotes as they are).
; EXAMPLE: public-server.ini - a public server anybody may join: the settings AntiFake comes
; EXAMPLE: with. A player sees their own visits, places and profile, the country table and who
; EXAMPLE: came when (without addresses); everything else stays with the admins.
; EXAMPLE: The lines marked EXAMPLE say what was changed for this kind of server and why; the
; EXAMPLE: rest is settings.ini as it comes, with the Steam key and the MySQL password left empty.
; EXAMPLE: Keep a copy of your settings.ini, copy this file over it (the name must stay
; EXAMPLE: settings.ini) and /recompile the script or restart the server.
; EXAMPLE: Example-configs/README.txt says more.

[General]
; Where the database is kept, relative to the server folder. The journal (antifake.jrn) sits
; next to it and the copies go to the backup folder beside it (nickreg/backup, together with the
; copies of ZitroStats). The folders are made when they are missing. A database found in the
; server folder itself (antifake.dat of older versions, with its .bak, .jrn and copies) is moved
; here at the first start, as long as this folder has none yet; nothing is deleted.
DatabaseFile = nickreg/antifake.dat
; How often the whole database is written while something changes (players join, play or
; leave), in minutes (1-1440). The old file is kept as antifake.dat.bak.
SaveIntervalMinutes = 15

[Storage]
; Between two full writes the changes go into a small journal next to the database
; (antifake.jrn), so a server that is killed loses seconds instead of the whole interval.
; The journal is thrown away and started again with every full write, and a journal that
; belongs to another copy of the database is ignored. 0 = no journal. (0-3600 seconds)
JournalSeconds = 10
; A copy of the finished file is kept in the backup folder beside the database (nickreg/backup,
; as antifake-<date>.dat; a database in the server folder itself keeps them in antifake-backups)
; this often, and the oldest ones over BackupKeep go away. 0 = no copies.
; (0-8760 hours, 1-100 copies)
BackupHours = 24
BackupKeep = 7
[MySQL]
; MySQL or MariaDB. AntiFake speaks the database protocol itself: no client library (libmysql)
; is needed, and the database may be 32- or 64-bit, on this machine or another one - MySQL 5.7,
; 8.x, 9.x and MariaDB 10.x, 11.x. The user's password may use mysql_native_password,
; caching_sha2_password (the MySQL 8 default) or sha256_password (not MariaDB's ed25519); a
; user or a server that insists on an encrypted (TLS) connection is refused, and /storage says
; so. The tables are made on the first run.
; The best choice is almost always mysql (several servers sharing one live database) or local
; (one server, the file alone); mirror only makes a copy for a website to read, or lets servers
; that keep their own files search each other - it is not a shared database of its own.
;   local  - the file only (the default)
;   mirror - the file is the database; every MysqlMinutes (and on /storage mirror) a whole copy
;            is written into af_profiles, af_other, af_visits, af_steam, af_links, af_geo and
;            af_meta for a website. At start the newer of the two is read: the copy when the
;            file is missing or older than it (a new machine, a lost disk), otherwise the file.
;   mysql  - one database for every server: all of them work on the same accounts, with every
;            name, Steam account, computer, address, visit and decision any of them saw. Every
;            server keeps it all in memory and exchanges its changes every SyncSeconds; what
;            several servers change at the same time adds up, nothing is overwritten. The file
;            stays a cache: without the database the server works from it and sends what it
;            collected once the database answers - after a restart as well, as long as
;            antifake.shared (beside the file, saying which account here is which one there) is
;            still there; without it a server that has joined before just takes the database as
;            it is, and what changed here meanwhile does not go in. Tables af_db_profiles,
;            af_db_verdicts, af_db_geo, af_db_meta.
Engine = local
MysqlHost =
MysqlPort = 3306
MysqlDatabase = soldat
MysqlUser =
; A password that begins or ends with a space goes in double quotes.
MysqlPassword =
; The RSA public key of the database server, for a database on another machine: the path (from
; the Soldat server folder) of its public_key.pem (in the data folder of MySQL, or the text of
; SHOW STATUS LIKE 'Caching_sha2_password_rsa_public_key' saved to a file). Without TLS the
; password of caching_sha2_password (when the server has it in no cache) and of sha256_password
; goes encrypted with an RSA key. Empty = the server is asked for its key, and anybody between
; this server and the database could answer with his own and read the password.
MysqlServerKey =
; Every game server of one database needs its own number. (1-100000)
MysqlServerId = 1
; Engine = mirror: how often the copy is written (1-10080 minutes). /storage mirror does it at
; once. A copy that failed is tried again after 1, 2, 4 ... minutes, never more often than this.
MysqlMinutes = 60
; Engine = mysql: seconds between two exchanges with the database (1-60). After an exchange that
; failed the next one waits longer, up to a minute.
SyncSeconds = 3
; The code page the player names arrive in, for the UTF-8 in the database:
; 1250 = Central European (Polish, Czech, ...), 1252 = Western European, 65001 = UTF-8; any
; other number takes the bytes as Latin-1 (ISO 8859-1). (0-65535)
; With 1250 the places and the Steam names keep their Polish (Czech, ...) letters in the game
; too; any other value keeps them in 1252, where such a letter is written as a plain one.
MysqlCodepage = 1250
; Engine = mirror: several servers on one database can look into each other's copies (Engine =
; mirror there too; their data is at most their MysqlMinutes old). Off by default; each switch on
; its own (Engine = mysql has every account of every server already):
; SharedSearch - /af_search, /searchall and /checkd also list the matching accounts of the other
;                servers, under the results of this one
; SharedLinks  - /statusa, /checkp and /multi <name> also list the accounts of the other
;                servers that share a Steam account, a computer or an address (for /checkp n:
;                a name) with this one
; An account of another server is shown as S<its MysqlServerId> #<its number there>.
SharedSearch = 0
SharedLinks = 0
[Commands]
; /commands of admins in the game (0 leaves them out). The server console and the remote admin
; always work: they have no other way in.
AdminCommands = 1
; /commands of every player (not only admins)
PlayerCommands = 0
; /commands typed in the public chat. Off by default: everybody would read them.
ChatCommands = 0
; The commands everybody may type in the chat with ! : their own visits and locations, their own
; profile, the country statistics of the server and the help. Players never see somebody else's
; addresses this way. 0 turns the ! commands off completely.
PublicCommands = 1
; Flood protection, the same idea as in ZitroStats: one command per player per CommandCooldownSeconds,
; one list (anything that searches, !mystatus and !statusa too) per HeavyCooldownSeconds, and at most
; MaxListsPerSecond lists a second on the whole server. Admins are not held back. (0-120, 0-600, 1-60)
CommandCooldownSeconds = 3
HeavyCooldownSeconds = 10
MaxListsPerSecond = 3
; Soldat cannot take a whole table at once: answers are sent to a player a few lines per tick
; (60 ticks a second), so a long list arrives smoothly instead of stalling the server.
; LinesPerTick 1-10: many lines to one player in one tick can stop the server (ZitroStats and
; Basic-Extended send theirs in the same tick), so keep it low. MaxQueuedLines 20-2000: the
; longest answer (a longer one ends with a line
; that says it was cut there) and the lines waiting for one player (a line of the script that
; finds them full is dropped and counted: "N more line(s) did not fit and were left out.").
LinesPerTick = 4
MaxQueuedLines = 200
; Rows per page of a result (3-30)
ResultsPerPage = 10
; How long a search may take before the result is thrown away (5-600 seconds)
TaskTimeoutSeconds = 30
; How long the "joined from ..." note waits for an address to be located (5-600 seconds)
LocateTimeoutSeconds = 30

[PlayerCommands]
; What a player without admin may ask with ! . Each line takes one of three words:
;   off  - admins only (they use / , and they have to be admins)
;   self - a player may ask about themselves and nobody else
;   all  - a player may ask about anybody
; PublicCommands = 0 above turns every ! command off, whatever is written here.
; Admins always have everything through / . An address is shown whole only to admins and to
; the player it belongs to; anybody else sees its first two numbers (83.22.*.*). A Steam
; account or a computer is shown whole the same way; anybody else sees its first 3 characters
; and ***.
; !visits, !uniquevisits, !locations - when, how long and from where somebody played. With
; "self" a player who names somebody else is told so. "all" also gives !lastvisits, the
; newest visits of the whole server (addresses masked); this same reach decides whether a
; player may name somebody else inside !lastvisitors too (PlayerLastVisitors below is the
; setting for !lastvisitors itself).
PlayerVisits = self
; !visitstats - the table of countries of the whole server. No addresses, no names in it.
PlayerVisitStats = all
; !visitsof <country> - which players come from a given country. "self" makes no sense here,
; so anything but "all" means admins only.
PlayerVisitsOf = off
; !mystatus (self) and !statusa <player> (all); !af_status is the same as !mystatus without a
; name (the console has none of its own and has to name a player). The accounts tied to the
; one asked about are in it only for whom PlayerMulti lets ask /multi about that account.
PlayerStatus = self
; !mynames (self), !privacy and !privacyall <kind> <player> (all)
PlayerNames = self
; !steam - the Steam name, the age of the account and its bans
PlayerSteam = self
; !locate (self) and !locate <player> / !locateall (all). A player sees the country, the city
; and the provider; an admin also the address, the country code, the region, the postcode, the
; kind of line (proxy/VPN, server room, mobile) and the host name.
PlayerLocate = self
; !listprofiles, !online, !showid - the list of accounts. Only "all" or "off" mean anything.
PlayerProfiles = off
; !af_search, !searchall, !smartsearch, !checkd, !checkp, !geosearch, !showlocate
PlayerSearch = off
; !multi - the accounts that look like one person
PlayerMulti = off
; !antifake and the pages of a list (!af_next, !af_prev, !af_page)
PlayerHelp = all
; !lastvisitors - who came, when, how often and for how long, one row per account, without
; addresses or places. Naming a player inside it takes the reach of PlayerVisits, not this
; one; "self" means the same as "off" here, since the list itself is about other players,
; not the one who asks.
PlayerLastVisitors = all
[Colors]
; The colours of everything AntiFake writes, as RRGGBB (a #, a $ or 0x in front is allowed).
; Write all six digits: FFF is read as 000FFF, a dark blue.
; ColorMain    - the headings of the tables and the ordinary lines
; ColorInfo    - the frames and the "looking for..." lines
; ColorData    - the rows of a table and the legends
; ColorWarning - something the admin should notice
; ColorError   - something went wrong, or a very high multi-account score
; ColorGood    - the "joined from ..." line, and the news that a write or a copy is done
ColorMain = F0E68C
ColorInfo = 87CEEB
ColorData = C0C0C0
ColorWarning = FFD700
ColorError = FF6347
ColorGood = 66CC66
[Diagnostics]
; Writes every step of a login, of a correction and of a lookup of a place to
; logs/antifake/trace.log. It writes the file
; on every join, on the game thread, so leave it off; turn it on when logins go wrong, and the
; last lines say where. (logs/antifake/antifake.log, the events and the admin commands, is
; always written, by a thread of its own.)
Trace = 0

[Geo]
; Look up where an address is (ip-api.com, over plain HTTP). Off means no requests leave the
; server at all. Local and private addresses are never sent. No more than 40 lookups start in
; any one minute, whatever asks for them; one that gets no answer pauses the next lookups for a
; minute, then two, four and so on, up to 30 minutes, and when ip-api.com says its own limit is
; reached they wait as long as it asks, 5 minutes at most. An answer over 16 KB is refused.
Enabled = 1
; Lookups running at the same time (1-32); 1 = strictly one at a time
MaxLookups = 4
; An address that could not be located is asked about again after this many seconds (10-86400)
RetrySeconds = 600
; How long one request may take (500-60000 ms); one lookup as a whole ends after twice this
TimeoutMs = 5000
; A location older than this many days is looked up again at the next join from it (1-3650)
RefreshDays = 90
; A location that has not been looked up for this long is forgotten by the daily cleanup (an
; address players keep coming from is looked up again every RefreshDays, so it stays).
; 0 = keep them for ever. (0-3650)
GeoKeepDays = 365
; Place names (and the names on Steam) come from the web in UTF-8 and the game console draws one
; byte per character, so they are converted when they are stored. 0 = keep the accents the
; console can draw (Vasteras stays Vasteras with its dots), 1 = plain letters only.
GeoTextPlain = 0

[Visits]
; Every join is written into the visit log of the account: when, how long, under which name, from
; which computer and address, from which country, and how sure that location is.
; A visit that is still running is extended instead of a new one being written, as long as the
; address is the same and the last update is less than VisitCooldownMinutes old. Joining and
; leaving in a loop therefore counts as one visit. 0 = no time limit: every join from the same
; address as the last visit extends that visit. (0-1440)
VisitCooldownMinutes = 10
; How many visits an account keeps (0 = the most, 200; 0-200) and how old they may get (0 = for
; ever, 0-3650 days); the oldest go first, whenever a visit is added and in the daily cleanup.
VisitKeepCount = 50
VisitKeepDays = 365
; How many rows /lastvisits and /lastvisitors show at most, newest first (10-5000)
LastVisitsRows = 500

[MultiAccounts]
; Two accounts are tied together when they were played from the same computer or the same
; Steam account, or (with MultiAccountByAddress) from the same address or the same /24 network.
; /multi lists every account that is tied to another one; the notice says it in the server
; console and to the admins in the game when such a player joins. Nobody else sees it: it is
; two players put side by side. A status (!mystatus too) shows the ties of an account only to
; whom PlayerMulti lets ask /multi about it.
MultiAccountNotice = 1
; How many other accounts it takes: /multi lists an account tied to at least this many, and
; the notice says nothing before this many are worth one (MultiAccountReportScore and
; MultiAccountMinSignals reached, the pair not judged by an admin). (1-100)
MultiAccountMinLinks = 1
; A shared address (and a shared /24 network) counts too. Turn it off on a server where whole
; flats and internet cafes share one address, and only a shared computer or Steam account will
; count.
MultiAccountByAddress = 1
; How much two accounts have to look like one person before the admins hear about it when
; such a player joins. The points: the same computer 60, the same Steam account 60, the same
; address 25, the same network 10, a nearly identical name 30 (a similar one 15, a slightly
; similar one 6). With the default 55 the admins hear about every shared computer, and about
; a shared address only when the name is nearly the same as well - a whole block behind one
; address is not worth a word on its own. Raise it to hear less, lower it to hear more.
; The /multi list always shows everything, whatever this is set to. (1-100)
MultiAccountReportScore = 55
; How many of those points have to come from different signals. 1 = one is enough; a pair has
; at most 4 signals (computer, Steam, address or network, name), so 1-4 is what matters - 5 and
; 6 are taken as 4. (1-6)
MultiAccountMinSignals = 1
; An address (or a /24 network) that more accounts than this have played from is a public one
; - a school, a cafe, a whole block behind one address - and it is skipped: it says nothing
; about anybody. (2-1000)
MultiAccountMaxShared = 20
; A computer is another matter: twenty accounts on one machine is not a cafe, it is twenty
; accounts on one machine, and that is exactly what this is here to find. This limit (for a
; computer and for a Steam account) is only there to bound the work when something absurd
; turns up. (2-5000)
MultiAccountMaxSharedComputer = 200
; At most this many tied accounts are collected and counted per account (1-500). A longer
; list is not read anyway, and the limit is what keeps the check cheap enough to run on
; every join.
MultiAccountMaxLinks = 25

[Steam]
; What Steam itself says about an account: the name on Steam, the country, when the account was
; made, whether the profile is public, and its VAC, game, community and trade bans. Off until an
; API key is put here; nothing is asked of Steam without one. Letters and digits only (Steam
; hands out 32 of them); anything else counts as a value out of range and leaves this off. A
; key Steam itself refuses stops asking with one line in the console, until this is changed;
; any other failure (no curl, no answer) pauses for a minute, then two, four and so on, up to
; an hour. The key goes to curl on its input, never on its command line, so it never shows up
; in a process list. Never publish this key or this file with it still in here.
; A free key for your own server: https://steamcommunity.com/dev/apikey
; EXAMPLE: left empty: put a key of your own here to turn the Steam part on
SteamApiKey =
; An account already known is asked about again only when what we have is older than this
; many days (1-365).
SteamRefreshDays = 7
; How many accounts are asked about in one request (1-100). Steam allows 100; the default is
; gentle enough for a busy server.
SteamBatchSize = 25
; Steam answers over HTTPS, so the request goes through curl, which Windows 10 and every current
; Linux already have. Put the whole path here if it is not on the PATH.
SteamCurlPath = curl
; How long one request may take (2-30 seconds)
SteamTimeoutSeconds = 10

[Retention]
; How long the data of a profile is kept. 0 = for ever. The newest entry of a kind always stays,
; so a profile never loses its last name, its last computer or its last address. The cleanup
; runs a minute after the start and then once a day.
; Addresses (0-3650 days)
AddressDays = 180
; Names (0-3650 days)
NameDays = 0
; Computers / HWIDs (0-3650 days)
HwidDays = 0
; At most this many addresses per profile; the oldest go first. 0 = no limit. (0-1000)
MaxAddresses = 50
; An entry (name, Steam account, computer, address) counts as one the account still uses when
; it is the one in use or was used inside this many days - that is what /privacy shows, while
; /privacyall shows the whole history. 0 = everything counts as current. (0-3650)
ActiveDays = 30
; Accounts nobody has played on for this long are emptied by the daily cleanup: the account
; number is kept, but its names, computers, addresses, visits, Steam data and admin decisions
; go, the number is reused by the next new player, and the cleanup report counts them. Skipped
; with Engine = mysql, where the other servers may still be using the account. 0 = keep them.
; (0-3650)
ProfileDays = 0
